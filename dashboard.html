<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>任务时钟 · Codex</title>
<style>
:root{color-scheme:dark;--bg:#101313;--card:#191e1d;--muted:#95a5a0;--line:#2b3531;--mint:#b9f6d1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eff5f1;font:14px/1.65 system-ui,"Microsoft YaHei",sans-serif}main{max-width:960px;margin:auto;padding:38px 24px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--mint)}h1{font-size:32px;font-weight:580;letter-spacing:-1px;margin:10px 0}p{color:var(--muted);margin:0}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.live{color:var(--mint);font-size:12px;border:1px solid var(--line);border-radius:20px;padding:5px 12px;white-space:nowrap}.live:before{content:'●';margin-right:8px}nav{display:flex;gap:10px;margin:30px 0 20px}button{font:inherit;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer}button[aria-pressed=true]{color:var(--mint);background:#24382d;border-color:#41664f}.task{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:22px;margin-bottom:16px}.taskhead{display:flex;justify-content:space-between;gap:20px}.title{font-size:17px;font-weight:550;overflow-wrap:anywhere}.badge{color:var(--mint);font-size:12px;white-space:nowrap}.metrics{display:grid;grid-template-columns:1fr 1.4fr;gap:24px;margin:24px 0 14px}.label{color:var(--muted);font-size:12px;margin-bottom:6px}.value{font-size:30px;line-height:1.2;font-variant-numeric:tabular-nums}.value.eta{color:var(--mint);font-size:27px}.note{font-size:12px;color:var(--muted)}.finish{border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;gap:16px;margin-top:16px;color:var(--muted);font-size:12px}.empty{border:1px dashed var(--line);border-radius:16px;padding:50px 24px;text-align:center}.empty strong{display:block;font-size:19px;margin-bottom:10px}footer{margin:28px 0;color:var(--muted);font-size:12px}.error{color:#ffc2a7}code{font:12px ui-monospace,monospace;color:var(--muted)}@media(max-width:500px){main{padding:24px 16px}.metrics{gap:12px}.value{font-size:25px}.value.eta{font-size:21px}.finish{flex-direction:column;gap:3px}h1{font-size:28px}}
.top{position:relative}.title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}@media(max-width:500px){.top{display:block;padding-top:12px}.live{position:absolute;right:0;top:0;font-size:10px;padding:2px 8px}.eyebrow{font-size:10px;letter-spacing:1px}h1{font-size:26px;margin-top:20px}.task{padding:18px}.title{font-size:15px}.metrics{grid-template-columns:1fr;gap:18px}.value.eta{font-size:24px}}
</style>
<main><div class="top"><div><div class="eyebrow">CODEX / TASK CLOCK</div><h1>任务还需要多久</h1></div><span class="live" id="live">正在连接</span></div>
<p>时间在这里看，工作继续进行。</p>
<nav aria-label="筛选任务"><button id="active" aria-pressed="true">进行中</button><button id="all" aria-pressed="false">最近任务</button></nav>
<div id="tasks" aria-live="polite"></div><footer><span id="privacy">本机运行 · 无外发 · 每 2 秒刷新</span><br>剩余时间是估算，任务范围变化或等待操作会影响结果。页面保持打开即可自动更新。</footer></main>
<script>
const token=location.hash.slice(1)||sessionStorage.getItem('task-clock-token')||'';if(token)sessionStorage.setItem('task-clock-token',token);history.replaceState(null,'',location.pathname);let showAll=false,last=null;
const $=s=>document.getElementById(s),statuses={running:'执行中',waiting:'等待批准',completed:'已完成',interrupted:'已中断',unknown:'状态未确认',stale:'状态待确认'};
function duration(n){n=Math.max(0,Math.round(n));if(n<60)return n+' 秒';if(n<3600)return Math.floor(n/60)+' 分 '+n%60+' 秒';return Math.floor(n/3600)+' 时 '+Math.floor(n%3600/60)+' 分'}
function clock(n){return new Date(n*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function draw(data){last=data;const root=$('tasks');root.replaceChildren();const tasks=data.tasks.filter(t=>showAll||['running','waiting','stale'].includes(t.status));if(!tasks.length){const e=el('div','empty');e.append(el('strong','',showAll?'还没有任务记录':'当前没有检测到正在执行的任务'),el('p','','新任务开始后将自动显示。首次收集历史时，剩余时间可能暂不可估算。'));root.append(e)}for(const t of tasks){const a=el('article','task'),head=el('div','taskhead');head.append(el('div','title',t.title),el('span','badge',statuses[t.status]||t.status));a.append(head);const m=el('div','metrics');for(const [label,value,cls] of [['已用时间',duration(t.elapsed),'value'],['预计剩余',t.remaining?duration(t.remaining[0])+' – '+duration(t.remaining[1]):t.status==='completed'?'已结束':t.status==='interrupted'?'已中断':t.estimate_source==='overdue'?'需要重新估算':'暂无法估算','value eta']]){const box=el('div');box.append(el('div','label',label),el('div',cls,value));m.append(box)}a.append(m,el('div','note',t.estimate_note+(t.sample_count?' · '+t.sample_count+' 个参考样本':'')));const f=el('div','finish');f.append(el('span','',t.finish?'预计结束 '+clock(t.finish[0])+' – '+clock(t.finish[1]):t.tool?'当前工具 '+t.tool:'开始于 '+clock(t.started)),el('code','',t.session.slice(0,8)+' · '+(t.source==='hook'?'钩子事件':'本地日志')));a.append(f);root.append(a)}$('privacy').textContent=data.privacy}
for(const [id,value]of [['active',false],['all',true]])$(id).onclick=()=>{showAll=value;$('active').setAttribute('aria-pressed',!value);$('all').setAttribute('aria-pressed',value);if(last)draw(last)};
async function refresh(){try{const res=await fetch('/api/status',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!res.ok)throw Error(res.status===401?'访问凭据已失效，请重新打开面板':'连接失败');draw(await res.json());$('live').textContent='实时更新';$('live').classList.remove('error')}catch(e){$('live').textContent=e.message;$('live').classList.add('error');if(last){for(const t of last.tasks){t.remaining=null;t.finish=null;t.estimate_note='连接已断开，当前显示为旧记录'}draw(last)}}finally{setTimeout(refresh,2000)}}refresh();
</script></html>
